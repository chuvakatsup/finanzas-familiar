<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sin internet · Mis Finanzas</title>
    <style>
      html { font-size: 112.5%; }
      body {
        margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
        background: #f6f7f9; color: #111418; padding: 16px; box-sizing: border-box;
      }
      main { max-width: 28rem; text-align: center; }
      h1 { font-size: 1.8rem; margin: 0.5rem 0; }
      p { font-size: 1.15rem; line-height: 1.5; }
      button {
        min-height: 3.5rem; width: 100%; border: 0; border-radius: 1rem; font-size: 1.15rem;
        font-weight: 600; background: #0b57d0; color: #fff; margin-top: 1rem;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #101216; color: #f2f4f7; }
        button { background: #8ab4f8; color: #0b1b33; }
      }
    </style>
  </head>
  <body>
    <main>
      <p style="font-size: 3rem; margin: 0" aria-hidden="true">📶</p>
      <h1>No hay internet</h1>
      <p>Tu información está a salvo. Revisa tu conexión (wifi o datos) y vuelve a intentar.</p>
      <button type="button" onclick="location.reload()">Volver a intentar</button>
    </main>
  </body>
</html>
