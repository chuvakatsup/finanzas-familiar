# Nginx del VPS → app en 127.0.0.1:3020.
# 1) Copiar a /etc/nginx/sites-available/finanzas.conf, cambiar finanzas.midominio.com
# 2) ln -s /etc/nginx/sites-available/finanzas.conf /etc/nginx/sites-enabled/
# 3) sudo certbot --nginx -d finanzas.midominio.com   (agrega los certificados)
# 4) sudo nginx -t && sudo systemctl reload nginx

# Límite de peticiones al login y enlaces secretos (además del de la app).
limit_req_zone $binary_remote_addr zone=finanzas_auth:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name finanzas.midominio.com;
    # certbot reemplaza esto por la redirección a https
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name finanzas.midominio.com;

    # ssl_certificate / ssl_certificate_key los agrega certbot.

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    server_tokens off;
    client_max_body_size 2m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # La app confía solo en X-Real-IP (nunca en lo que mande el navegador).
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_read_timeout 60s;

    location = /login {
        limit_req zone=finanzas_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:3020;
    }
    location ~ ^/(invitacion|restablecer)/ {
        limit_req zone=finanzas_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:3020;
    }

    # Solo el servicio cron (red interna de Docker) puede pedir los recordatorios.
    location /api/cron/ {
        return 404;
    }

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3020;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    }

    location / {
        proxy_pass http://127.0.0.1:3020;
    }
}
